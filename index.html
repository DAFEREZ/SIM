function Stories({idx,onClose}){

 useEffect(()=>{const t=setInterval(()=>setP(x=>x+2),100);return()=>clearInterval(t)},[]);
 useEffect(()=>{if(p>=100){if(k<2){setK(k+1);setP(0)}else onClose()}},[p]);
 const nav=d=>{const n=k+d;if(n<0||n>2)return n>2&&onClose();setK(n);setP(0)};

   </div>
  </div>
  {sh&&<div className='absolute inset-0 z-50 flex items-center justify-center bg-black/60' onClick={e=>{e.stopPropagation();setSh(false)}}><div onClick={e=>e.stopPropagation()} className='bg-neutral-900 rounded-xl w-[320px] max-w-[90%] p-4 fade space-y-1'><div className='font-semibold text-center pb-2 border-b border-neutral-800'>Bagikan</div><button className='w-full text-left py-2.5 px-2 hover:bg-neutral-800 rounded flex items-center gap-3' onClick={copy}><L.Link size={18}/>Copy link</button>{navigator.share&&<button className='w-full text-left py-2.5 px-2 hover:bg-neutral-800 rounded flex items-center gap-3' onClick={()=>{navigator.share({title:'detikcom',text:post.slides[0].title,url:link}).catch(()=>{});setSh(false)}}><L.Send size={18}/>Bagikan via...</button>}<button onClick={()=>setSh(false)} className='w-full py-2 text-sm text-neutral-400'>Batal</button></div></div>}
  {onPrev&&<button onClick={e=>{e.stopPropagation();onPrev()}} className="hidden md:block absolute left-3 top-1/2 bg-white/80 text-black rounded-full p-1"><L.ChevronLeft size={20}/></button>}
  {onNext&&<button onClick={e=>{e.stopPropagation();onNext()}} className="hidden md:block absolute right-3 top-1/2 bg-white/80 text-black rounded-full p-1"><L.ChevronRight size={20}/></button>}
 </div>;
}

const Grid=({posts,onOpen})=><div className='grid grid-cols-3 gap-0.5 sm:gap-1'>{posts.map(p=><button key={p.id} onClick={()=>onOpen(p.id)} className='relative aspect-[3/4] group overflow-hidden'><Slide s={p.slides[0]} small/>{p.slides.length>1&&<L.Layers size={16} className='absolute top-2 left-2'/>}<div className='absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition'/></button>)}</div>;
const Shell=({title,onClose,children})=><div className='fixed inset-0 md:left-[72px] z-20 bg-black overflow-y-auto fade pb-20 md:pb-0'><div className='max-w-[935px] mx-auto p-4 md:p-8'><div className='flex items-center justify-between mb-4'><h2 className='text-xl font-bold'>{title}</h2><button onClick={onClose} className='p-1 hover:bg-neutral-900 rounded'><L.X/></button></div>{children}</div></div>;
const Chip=({on,children,...r})=><button {...r} className={'px-3 py-1.5 rounded-lg text-sm whitespace-nowrap transition '+(on?'bg-white text-black':'bg-neutral-800 hover:bg-neutral-700')}>{children}</button>;
function Explore({posts,onOpen,onClose}){
 const cats=['Semua',...new Set(posts.map(p=>p.tag))];const [c,setC]=useState('Semua');
 const list=posts.filter(p=>c==='Semua'||p.tag===c).sort((a,b)=>b.likes-a.likes);
 return <Shell title='Explore' onClose={onClose}><div className='flex gap-2 overflow-x-auto pb-3'>{cats.map(x=><Chip key={x} on={c===x} onClick={()=>setC(x)}>{x}</Chip>)}</div><Grid posts={list} onOpen={onOpen}/></Shell>;
}
function Search({posts,onOpen,onClose}){
 const [q,setQ]=useState('');const s=q.trim().toLowerCase();
 const res=s?posts.filter(p=>('detikcom '+p.tag+' '+p.caption+' '+p.slides.map(x=>x.title).join(' ')).toLowerCase().includes(s)):[];
 return <Shell title='Search' onClose={onClose}>
  <div className='flex items-center gap-2 bg-neutral-800 rounded-lg px-3 py-2'><L.Search size={18} className='text-neutral-400'/><input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder='Cari caption, username, kategori' className='flex-1 bg-transparent outline-none text-sm'/>{q&&<button onClick={()=>setQ('')}><L.X size={16}/></button>}</div>
  {!s?<div className='mt-5'><div className='text-sm font-semibold mb-2'>Kategori populer</div><div className='flex flex-wrap gap-2'>{[...new Set(posts.map(p=>p.tag))].map(t=><Chip key={t} onClick={()=>setQ(t)}>{t}</Chip>)}</div></div>
  :res.length===0?<div className='text-center text-neutral-500 py-16 text-sm'>Tidak ada hasil untuk "{q}".</div>
  :<div className='mt-3'>{res.map(p=><button key={p.id} onClick={()=>onOpen(p.id)} className='w-full flex items-center gap-3 p-2 hover:bg-neutral-900 rounded-lg text-left'><div className='w-14 h-[74px] shrink-0 overflow-hidden rounded'><Slide s={p.slides[0]} small/></div><div className='min-w-0'><div className='text-sm font-semibold'>detikcom <span className='text-neutral-500 font-normal'>· {p.tag}</span></div><div className='text-xs text-neutral-400 line-clamp-2'>{p.slides[0].title}</div></div></button>)}</div>}
 </Shell>;
}
function Notifs({posts,store,onOpen,onClose}){
 const items=[...posts.filter(p=>store.liked[p.id]).map(p=>[p,'Kamu menyukai postingan detikcom']),...posts.filter(p=>(store.added[p.id]||[]).length).map(p=>[p,'Kamu berkomentar di postingan detikcom'])];
 return <Shell title='Notifications' onClose={onClose}>{store.following&&<div className='py-3 text-sm border-b border-neutral-900'>Kamu mulai mengikuti <b>detikcom</b>.</div>}
  {items.length===0&&!store.following?<div className='text-center text-neutral-500 py-16 text-sm'>Belum ada aktivitas. Coba like atau komentar sebuah postingan.</div>:items.map(([p,t],i)=><button key={i} onClick={()=>onOpen(p.id)} className='w-full flex items-center gap-3 p-2 hover:bg-neutral-900 rounded-lg text-left'><div className='w-11 h-14 shrink-0 overflow-hidden rounded'><Slide s={p.slides[0]} small/></div><div className='text-sm'>{t}: <span className='text-neutral-400'>{p.slides[0].title.slice(0,50)}</span></div></button>)}</Shell>;
}
function Msgs({store,setStore,onClose}){
 const [v,setV]=useState('');const m=store.msgs||[];
 const add=x=>setStore(s=>({...s,msgs:[...(s.msgs||[]),x]}));
 const send=()=>{const t=v.trim();if(!t)return;add({me:1,t});setV('');setTimeout(()=>add({me:0,t:'Terima kasih sudah menghubungi detikcom! Ini balasan otomatis.'}),800)};
 return <Shell title='Messages' onClose={onClose}><div className='flex items-center gap-3 pb-3 border-b border-neutral-800'><Avatar s={40}/><div className='font-semibold text-sm'>detikcom <Verified/></div></div>
  <div className='py-4 space-y-2 min-h-[40vh]'>{m.length===0&&<div className='text-center text-neutral-500 text-sm pt-10'>Mulai percakapan dengan detikcom.</div>}{m.map((x,i)=><div key={i} className={'flex '+(x.me?'justify-end':'')}><div className={'px-3 py-2 rounded-2xl text-sm max-w-[75%] '+(x.me?'bg-[#3797f0]':'bg-neutral-800')}>{x.t}</div></div>)}</div>
  <div className='flex gap-2 border border-neutral-700 rounded-full px-4 py-2'><input value={v} onChange={e=>setV(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder='Message...' className='flex-1 bg-transparent outline-none text-sm'/><button onClick={send} disabled={!v.trim()} className='text-[#0095f6] font-semibold text-sm disabled:opacity-40'>Send</button></div></Shell>;
}
function Create({onCreate,onClose}){
 const [t,setT]=useState(''),[tag,setTag]=useState('NASIONAL'),[cap,setCap]=useState('');
 const go=()=>{if(!t.trim())return;onCreate({id:Date.now(),tag,likes:0,slides:[{title:t.trim(),tag,k:0,c:PAL[0]}],caption:cap.trim()||t.trim(),comments:[]})};
 return <Shell title='Create Post' onClose={onClose}><div className='max-w-md space-y-3'><input value={t} onChange={e=>setT(e.target.value)} placeholder='Judul berita' className='w-full bg-neutral-900 border border-neutral-700 rounded-lg px-3 py-2 text-sm outline-none'/><select value={tag} onChange={e=>setTag(e.target.value)} className='w-full bg-neutral-900 border border-neutral-700 rounded-lg px-3 py-2 text-sm'>{Object.keys(KIND).map(k=><option key={k}>{k}</option>)}</select><textarea value={cap} onChange={e=>setCap(e.target.value)} rows={3} placeholder='Caption' className='w-full bg-neutral-900 border border-neutral-700 rounded-lg px-3 py-2 text-sm outline-none'/><button onClick={go} disabled={!t.trim()} className='bg-[#0095f6] hover:bg-[#1877f2] disabled:opacity-40 px-5 py-2 rounded-lg text-sm font-semibold'>Bagikan</button></div></Shell>;
}
function More({onSaved,onReset,onClose}){
 return <Shell title='More' onClose={onClose}><div className='max-w-sm space-y-1'><button onClick={onSaved} className='w-full text-left p-3 hover:bg-neutral-900 rounded-lg flex gap-3'><L.Bookmark size={20}/>Saved</button><button onClick={onReset} className='w-full text-left p-3 hover:bg-neutral-900 rounded-lg flex gap-3 text-red-400'><L.X size={20}/>Reset semua data</button></div></Shell>;
}
function App(){
 const [store,setStore]=useStore();
 const [tab,setTab]=useState("posts"),[open,setOpen]=useState(null),[story,setStory]=useState(null),[page,setPage]=useState("Profile"),[note,setNote]=useState("");
 const [unf,setUnf]=useState(false),[ld,setLd]=useState(true);
 useEffect(()=>{const t=setTimeout(()=>setLd(false),700);return()=>clearTimeout(t)},[]);
 const ALL=[...(store.custom||[]),...POSTS];
 const toast=m=>{setNote(m);setTimeout(()=>setNote(''),1800)};
 const follow=()=>store.following?setUnf(true):(setStore(s=>({...s,following:true})),toast('Kamu mengikuti detikcom'));
 const go=n=>{if(n==='Home'||n==='Profile'){setPage('Profile');window.scrollTo({top:0,behavior:'smooth'})}else if(n==='Reels'){setPage('Profile');setTab('reels')}else setPage(n)};
 const back=()=>setPage('Profile');
 const list=tab==='posts'?ALL:tab==='reels'?ALL.filter((_,i)=>i%2===0):tab==='saved'?ALL.filter(p=>store.saved[p.id]):[];
 const idx=open?ALL.findIndex(p=>p.id===open):-1;
 const fol=PROFILE.followers+(store.following?1:0);
 const tabs=[['posts',L.Grid3x3],['reels',L.Clapperboard],['saved',L.Bookmark],['tagged',L.UserSquare]];
 return <div className="min-h-screen">
  <Sidebar go={go} page={page}/>
  <main className="md:ml-[72px] pb-24 md:pb-10 max-w-[935px] mx-auto px-4 md:px-5 pt-6 md:pt-10">
   <header className="flex flex-col sm:flex-row gap-6 sm:gap-20 sm:pl-10 items-center sm:items-start">
    <div className="sm:mr-0"><Avatar s={window.innerWidth<640?96:150}/></div>
    <div className="flex-1 min-w-0 w-full">
     <div className="flex flex-wrap items-center gap-3">
      <h1 className="text-xl font-normal flex items-center gap-1.5">{PROFILE.username}<Verified s={18}/></h1><L.MoreHorizontal size={20}/>
     </div>
     <div className="flex gap-2 mt-4">
      <button onClick={follow} className={"flex-1 max-w-[150px] py-1.5 rounded-lg text-sm font-semibold transition "+(store.following?"bg-neutral-800 hover:bg-neutral-700":"bg-[#0095f6] hover:bg-[#1877f2]")}>{store.following?"Following":"Follow"}</button>
      <button onClick={()=>setPage('Messages')} className="flex-1 max-w-[150px] py-1.5 rounded-lg text-sm font-semibold bg-neutral-800 hover:bg-neutral-700">Message</button>
      <button title='Temukan akun & berita' onClick={()=>setPage('Explore')} className="px-3 rounded-lg bg-neutral-800 hover:bg-neutral-700"><L.UserPlus size={16}/></button>
     </div>
     <div className="flex gap-8 mt-5 text-sm"><span><b>{PROFILE.posts}</b> posts</span><span><b>{fmt(fol)}</b> followers</span><span><b>{PROFILE.following}</b> following</span></div>
     <div className="mt-4 text-sm"><div className="text-neutral-400 text-xs">{PROFILE.cat}</div><div className="whitespace-pre-line">{PROFILE.bio}</div>
      <div className="mt-2 flex gap-4 font-semibold text-[#e0f1ff]"><span className="flex items-center gap-1"><L.Link size={13}/>{PROFILE.link}</span><span className="flex items-center gap-1"><L.Globe size={13}/>{PROFILE.web}</span></div>
      <div className="mt-3 text-xs text-neutral-400">Followed by {PROFILE.followedBy}</div></div>
    </div>
   </header>
   <section className="flex gap-4 sm:gap-8 mt-10 sm:pl-10 overflow-x-auto pb-2">
    {HL.map((h,i)=><button key={h} onClick={()=>setStory(i)} className="flex flex-col items-center gap-2 shrink-0 group">
     <div className="w-[77px] h-[77px] rounded-full border border-neutral-600 p-[3px] group-hover:border-neutral-300 group-hover:scale-105 transition"><div className="relative w-full h-full rounded-full overflow-hidden"><Scene kind={HS[i][0][0]} k={0}/><div className="absolute inset-0 bg-black/25 flex items-center justify-center">{React.createElement([L.Tv,L.ShoppingCart,L.Users,L.Megaphone,L.Tag][i],{size:28})}</div></div></div>
     <span className="text-xs">{h}</span></button>)}
   </section>
   <div className="border-t border-neutral-800 mt-8 flex justify-center gap-14">
    {tabs.map(([k,I])=><button key={k} onClick={()=>setTab(k)} title={k} className={"py-4 border-t -mt-px transition "+(tab===k?"border-white text-white":"border-transparent text-neutral-500")}><I size={20}/></button>)}
   </div>
   {ld?<div className='grid grid-cols-3 gap-0.5 sm:gap-1'>{Array.from({length:9}).map((_,i)=><div key={i} className='aspect-[3/4] bg-neutral-900 animate-pulse'/>)}</div>:list.length===0?<div className="text-center text-neutral-500 py-20 text-sm">{tab==='saved'?'Belum ada postingan tersimpan. Klik ikon bookmark di postingan.':'Belum ada postingan yang ditandai.'}</div>:
   <div className="grid grid-cols-3 gap-0.5 sm:gap-1 fade" key={tab}>
    {list.map(p=><button key={p.id} onClick={()=>setOpen(p.id)} className="relative aspect-[3/4] group overflow-hidden">
     <Slide s={p.slides[0]} small/>
     {p.slides.length>1&&<L.Layers size={16} className="absolute top-2 left-2 drop-shadow"/>}
     {tab==="reels"&&<L.Play size={16} fill="#fff" className="absolute top-2 left-2"/>}
     <div className="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition flex items-center justify-center gap-5 text-sm font-bold">
      <span className="flex items-center gap-1"><L.Heart size={18} fill="#fff"/>{fmt(p.likes+(store.liked[p.id]?1:0))}</span>
      <span className="flex items-center gap-1"><L.MessageCircle size={18} fill="#fff"/>{p.comments.length+(store.added[p.id]||[]).length}</span></div>
    </button>)}
   </div>}
  </main>
  {page==='Explore'&&<Explore posts={ALL} onOpen={setOpen} onClose={back}/>}
  {page==='Search'&&<Search posts={ALL} onOpen={setOpen} onClose={back}/>}
  {page==='Notifications'&&<Notifs posts={ALL} store={store} onOpen={setOpen} onClose={back}/>}
  {page==='Messages'&&<Msgs store={store} setStore={setStore} onClose={back}/>}
  {page==='Create'&&<Create onClose={back} onCreate={c=>{setStore(s=>({...s,custom:[c,...(s.custom||[])]}));setTab('posts');back();toast('Postingan dibuat')}}/>}
  {page==='More'&&<More onClose={back} onSaved={()=>{setTab('saved');back()}} onReset={()=>{setStore({following:false,liked:{},saved:{},added:{},cliked:{},custom:[],msgs:[]});back();toast('Data direset')}}/>}
  {open&&idx>=0&&<Modal post={ALL[idx]} store={store} setStore={setStore} onFollow={follow} onClose={()=>setOpen(null)} onPrev={idx>0?()=>setOpen(ALL[idx-1].id):null} onNext={idx<ALL.length-1?()=>setOpen(ALL[idx+1].id):null}/>}
  {unf&&<div className='fixed inset-0 z-[60] bg-black/70 flex items-center justify-center fade' onClick={()=>setUnf(false)}><div onClick={e=>e.stopPropagation()} className='bg-neutral-900 rounded-xl w-[320px] max-w-[90%] text-center overflow-hidden'><div className='p-6'><Avatar s={64}/><div className='mt-3 text-sm'>Unfollow <b>detikcom</b>?</div></div><button onClick={()=>{setStore(s=>({...s,following:false}));setUnf(false);toast('Kamu berhenti mengikuti detikcom')}} className='w-full py-3 border-t border-neutral-800 text-red-500 font-semibold text-sm hover:bg-neutral-800'>Unfollow</button><button onClick={()=>setUnf(false)} className='w-full py-3 border-t border-neutral-800 text-sm hover:bg-neutral-800'>Batal</button></div></div>}
  {story!==null&&<Stories idx={story} onClose={()=>setStory(null)}/>}
  {note&&<div className="fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-50 bg-neutral-800 px-4 py-2 rounded-lg text-sm fade">{note}</div>}
 </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
